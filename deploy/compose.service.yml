# ============================================================================
# Understud: fragmen service untuk compose infra bersama (~/infra/docker-compose.yml).
#
# Salin blok `understud-api` dan `understud-web` di bawah ke dalam compose infra
# milikmu (di dalam key `services:`). Sesuaikan:
#   - `networks:`        -> nama network internal milikmu
#   - `env_file:`        -> path .env Understud di server
#   - `ports:`           -> sesuaikan port host kalau 3010 sudah dipakai
#   - `mem_limit:`       -> longgarkan bila perlu
#
# Catatan:
#   - Tidak ada `build:`: image datang dari GHCR.
#   - Tidak ada service `db`: pakai Postgres + pgbouncer milikmu (lihat
#     DATABASE_URL di .env.prod.example).
#   - Tidak ada ingress tunnel di sini: daftarkan hostname di
#     ~/infra/cloudflared/config.yml (lihat README).
# ============================================================================

services:
  understud-api:
    image: ghcr.io/fzrilsh/understud-api:latest
    restart: unless-stopped
    networks: [internal]
    env_file: /home/deploy/services/understud/.env
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  understud-web:
    image: ghcr.io/fzrilsh/understud-web:latest
    restart: unless-stopped
    networks: [internal]
    environment:
      # Satu network compose: proxy ke service api lewat nama service.
      API_UPSTREAM: http://understud-api:8080
    ports:
      # cloudflared meneruskan ke sini. Ganti 3010 kalau sudah dipakai service lain.
      - "127.0.0.1:3010:80"
    mem_limit: 64m
    depends_on:
      - understud-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Network `internal` diasumsikan sudah didefinisikan di compose infra milikmu.
# Kalau belum, tambahkan di bagian `networks:` paling bawah:
#
# networks:
#   internal:
#     name: infra_internal
