# Root compose — menjalankan seluruh stack (db + api + web) sekaligus.
# Untuk juri: `docker-compose up -d` lalu buka http://localhost:3000.
#
# Catatan: backend/ dan frontend/ juga punya docker-compose.yml masing-masing
# (dipakai kalau mau jalanin salah satu service sendiri saat development).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackathon
    ports:
      # Host port default 5433 (bukan 5432): 5432 hampir selalu dipakai Postgres
      # native di mesin dev, dan port-forward kalah → dev mode nyambung ke DB salah.
      # Container internal tetap 5432; api→db lewat network compose, tidak terpengaruh.
      # Override: DB_PORT=5432 docker-compose up -d
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 3

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hackathon?sslmode=disable
      PORT: "8080"
      # JWT_SECRET sengaja TIDAK di-set: server generate acak saat start (audit C1).
      # Produksi: set JWT_SECRET kuat via env VPS.
      # TTL token (spec §5): staf 1 minggu, siswa anonim 10 tahun.
      STAFF_TOKEN_TTL: 168h
      ANON_TOKEN_TTL: 87600h
      CORS_ORIGINS: http://localhost:3000,http://localhost:3100,http://localhost:5173
      TZ: Asia/Jakarta
      # Lampiran chat (spec §8) — persisten via volume `uploads`.
      UPLOAD_DIR: /app/data/uploads
      # AI (OpenAI-compatible) — dibaca dari file `.env` di folder ini (compose
      # otomatis memuat `.env` untuk interpolasi ${...}) atau dari env shell.
      # Kosong = fitur ringkasan AI nonaktif (backend tetap jalan normal).
      AI_BASE_URL: ${AI_BASE_URL:-http://localhost:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_DEBOUNCE_SECONDS: ${AI_DEBOUNCE_SECONDS:-5}
      # Rate limit / geofence (opsional; default sudah aman)
      GEO_FENCE_ENABLED: ${GEO_FENCE_ENABLED:-false}
      SCHOOL_LAT: ${SCHOOL_LAT:-}
      SCHOOL_LNG: ${SCHOOL_LNG:-}
      SCHOOL_RADIUS_M: ${SCHOOL_RADIUS_M:-200}
    # Agar container bisa menjangkau AI provider di HOST (mis. http://host.docker.internal:20128/v1).
    # host-gateway berfungsi di Linux & Docker Desktop (macOS/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Override bila 8080 sudah dipakai: `API_PORT=8081 docker-compose up -d`
      - "${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      # Satu network compose: proxy ke service `api` langsung (bukan host.docker.internal).
      API_UPSTREAM: http://api:8080
    ports:
      # Override bila 3000 sudah dipakai: `WEB_PORT=3100 docker-compose up -d`
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  uploads:
