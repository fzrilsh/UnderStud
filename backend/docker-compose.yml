services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackathon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 3

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hackathon?sslmode=disable
      PORT: "8080"
      JWT_SECRET: dev-secret-change-me-in-prod
      AUTH_TOKEN_TTL: 87600h
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
