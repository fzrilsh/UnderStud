services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackathon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 3

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hackathon?sslmode=disable
      PORT: "8080"
      # JWT_SECRET TIDAK di-set: server generate acak (audit C1/NV-3).
      STAFF_TOKEN_TTL: 168h
      ANON_TOKEN_TTL: 87600h
      # AI (OpenAI-compatible) — dari file `.env` di folder ini atau env shell.
      # Kosong = ringkasan AI nonaktif (backend tetap jalan).
      AI_BASE_URL: ${AI_BASE_URL:-http://localhost:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_DEBOUNCE_SECONDS: ${AI_DEBOUNCE_SECONDS:-5}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
