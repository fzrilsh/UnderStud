openapi: 3.1.0
info:
  title: Hackathon Starter API
  version: 1.0.0
  description: Long-lived JWT via httpOnly cookie; no refresh token. Bearer fallback for curl.
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: auth
  - name: health
  - name: reports
  - name: students
  - name: observations
paths:
  /healthz:
    get:
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: DB down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in; sets auth_token cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout — clears auth cookie
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user (protected)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/reports:
    get:
      tags: [reports]
      summary: BK sidebar queue (PIN ∪ DRAFT ∪ ANTREAN; excludes 'dilewati')
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportItem" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/reports/history:
    get:
      tags: [reports]
      summary: BK history (skipped 'dilewati' + hidden_by_staff_at)
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportItem" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/reports/{id}:
    get:
      tags: [reports]
      summary: Report detail (messages + attachments)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReportDetail" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [reports]
      summary: Soft-hide report on BK side
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
  /api/v1/reports/{id}/pin:
    post:
      tags: [reports]
      summary: Pin (sets pinned_at, clears drafted_at)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
    delete:
      tags: [reports]
      summary: Unpin
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
  /api/v1/reports/{id}/draft:
    post:
      tags: [reports]
      summary: Mark as draft (sets drafted_at, clears pinned_at)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
    delete:
      tags: [reports]
      summary: Leave draft (requires ≥1 reply)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/reports/{id}/next:
    post:
      tags: [reports]
      summary: Skip report (requires ≥1 reply)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/reports/{id}/messages:
    post:
      tags: [reports]
      summary: BK reply
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MessageView" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students:
    get:
      tags: [students]
      summary: List students (BK all, Wali Kelas scoped to own kelas)
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StudentItem" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [students]
      summary: Create student manually (Wali Kelas only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStudentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudentItem" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/import/preview:
    post:
      tags: [students]
      summary: Upload E-Rapor CSV → preview (no DB writes; returns preview_token)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ImportPreview" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "413": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/import/commit:
    post:
      tags: [students]
      summary: Apply a preview (upsert by NIS)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_token]
              properties:
                preview_token: { type: string }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ImportResult" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "410": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}:
    get:
      tags: [students]
      summary: Student detail (profile + observations + latest_summary)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudentDetail" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      tags: [students]
      summary: Edit student name/NIS/kelas (Wali Kelas only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStudentInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudentItem" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/profile:
    put:
      tags: [students]
      summary: Save student profile (Wali Kelas only) — triggers AI summary
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ProfileView" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/archive:
    post:
      tags: [students]
      summary: Archive student (Wali Kelas only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/restore:
    post:
      tags: [students]
      summary: Restore archived student (Wali Kelas only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/observations:
    get:
      tags: [observations]
      summary: List observations for a student
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ObservationView" }
                  meta: { $ref: "#/components/schemas/Meta" }
    post:
      tags: [observations]
      summary: Create observation (Wali Kelas only) — triggers AI summary
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObservationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ObservationView" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/summaries:
    get:
      tags: [students]
      summary: List AI summary versions for a student
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SummaryView" }
                  meta: { $ref: "#/components/schemas/Meta" }
  /api/v1/students/{id}/summaries/latest:
    get:
      tags: [students]
      summary: Latest AI summary (503 AI_NOT_CONFIGURED when AI off)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SummaryView" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/summaries/{sid}/export:
    get:
      tags: [students]
      summary: Export summary as PDF/TXT (records an audit row)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [pdf, txt] }
      responses:
        "200":
          description: File download (Content-Disposition attachment)
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/observations/{id}:
    put:
      tags: [observations]
      summary: Edit observation (Wali Kelas only) — saves a revision — triggers AI summary
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObservationInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ObservationView" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/observations/{id}/revisions:
    get:
      tags: [observations]
      summary: Observation edit history
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RevisionView" }
  /api/v1/observations/{id}/handle:
    post:
      tags: [observations]
      summary: Mark a red-flag observation as handled (BK only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/red-flags:
    get:
      tags: [observations]
      summary: Active red flags (BK all, Wali Kelas scoped); only unhandled
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RedFlagItem" }
                  meta: { $ref: "#/components/schemas/Meta" }
  /api/v1/checklist:
    get:
      tags: [observations]
      summary: Fixed observation checklist catalog (28 items)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ChecklistItem" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OkResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  ok: { type: boolean }
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        db:
          type: string
          enum: [up, down]
    Meta:
      type: object
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [INVALID_INPUT, UNAUTHORIZED, TOKEN_EXPIRED, FORBIDDEN, ACCOUNT_INACTIVE,
                 OUT_OF_SCOPE, CHAT_HIDDEN_BY_STUDENT, CHAT_CLOSED_BY_STAFF, OUT_OF_RANGE,
                 LOCATION_IMPRECISE, LOCATION_UNAVAILABLE, NOT_FOUND, PREVIEW_EXPIRED,
                 CONFLICT, RATE_LIMITED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA,
                 AI_NOT_CONFIGURED, AI_FAILED, INTERNAL]
            message:
              type: string
    ReportIdentity:
      type: object
      properties:
        mode: { type: string, enum: [anonim, profil] }
        name: { type: string }
        kelas: { type: string }
    ReportItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [baru, dibuka, dilewati] }
        pinned: { type: boolean }
        drafted: { type: boolean }
        identity: { $ref: "#/components/schemas/ReportIdentity" }
        last_message_at: { type: string, format: date-time }
    AttachmentView:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mime: { type: string }
        size_bytes: { type: integer }
    MessageView:
      type: object
      properties:
        id: { type: string, format: uuid }
        sender: { type: string, enum: [SISWA, BK] }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AttachmentView" }
        created_at: { type: string, format: date-time }
    ReportDetail:
      type: object
      properties:
        chat: { $ref: "#/components/schemas/ReportItem" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/MessageView" }
    StudentItem:
      type: object
      required: [id, name, kelas]
      properties:
        id: { type: string, format: uuid }
        nis: { type: string }
        name: { type: string }
        kelas: { type: string }
        archived_at: { type: string, format: date-time, nullable: true }
        has_red_flag: { type: boolean }
    CreateStudentInput:
      type: object
      required: [name, kelas]
      properties:
        nis: { type: string }
        name: { type: string }
        kelas: { type: string }
    EraporRow:
      type: object
      required: [mapel, nilai]
      properties:
        mapel: { type: string }
        nilai: { type: number }
        periode: { type: string }
    ProfileInput:
      type: object
      properties:
        nilai_erapor:
          type: array
          items: { $ref: "#/components/schemas/EraporRow" }
        minat_bakat: { type: string, maxLength: 1000 }
        tanggal_lahir: { type: string, format: date }
        catatan_psikologis: { type: string, maxLength: 2000 }
        catatan_kasus_prestasi: { type: string, maxLength: 2000 }
        masukan_bk: { type: string, maxLength: 2000 }
        pendapat_wali_kelas: { type: string, maxLength: 2000 }
    ProfileView:
      type: object
      properties:
        nilai_erapor:
          type: array
          items: { $ref: "#/components/schemas/EraporRow" }
        minat_bakat: { type: string }
        tanggal_lahir: { type: string, format: date }
        catatan_psikologis: { type: string }
        catatan_kasus_prestasi: { type: string }
        masukan_bk: { type: string }
        pendapat_wali_kelas: { type: string }
        updated_at: { type: string, format: date-time }
    ObservationInput:
      type: object
      required: [items, tanggal]
      properties:
        items:
          type: array
          items: { type: string }
          description: 'Item keys, e.g. "emosi:murung" or "tidak_ada" (exclusive)'
        catatan: { type: string, maxLength: 1000 }
        tanggal: { type: string, format: date }
        tindakan_awal:
          type: string
          enum: [pantau, konsultasi_bk, eskalasi_segera]
    ObservationView:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        items:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
        red_flag: { type: boolean }
        handled_at: { type: string, format: date-time, nullable: true }
        catatan: { type: string }
        tanggal: { type: string, format: date }
        tindakan_awal: { type: string }
        author_name: { type: string }
    RevisionView:
      type: object
      properties:
        id: { type: string, format: uuid }
