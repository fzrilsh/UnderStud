openapi: 3.1.0
info:
  title: UnderStud API
  version: 1.0.0
  description: Long-lived JWT via httpOnly cookie; no refresh token. Bearer fallback for curl.
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: auth
  - name: health
  - name: anon
  - name: reports
  - name: students
  - name: observations
paths:
  /healthz:
    get:
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: DB down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in; sets auth_token cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout — clears auth cookie
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user (protected)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/lapor:
    get:
      tags: [anon]
      summary: Bootstrap anon session (sets anon_token cookie if absent) + profile + chats
      responses:
        "200":
          description: Bootstrap payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LaporBootstrap" }
  /api/v1/lapor/profile:
    get:
      tags: [anon]
      summary: Read pelapor identity (name + kelas)
      security:
        - anonCookie: []
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AnonProfile" }
    put:
      tags: [anon]
      summary: Save pelapor identity (both fields optional; 80/40 max)
      security:
        - anonCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnonProfile" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AnonProfile" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/lapor/chats:
    get:
      tags: [anon]
      summary: Student chat sidebar (own session, excludes hidden)
      security:
        - anonCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ChatSummary" }
                  meta: { $ref: "#/components/schemas/Meta" }
    post:
      tags: [anon]
      summary: Create report (multipart with body, identity_mode, files, lat/lng/accuracy)
      security:
        - anonCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 2000 }
                identity_mode: { type: string, enum: [anonim, profil] }
                files:
                  type: array
                  items: { type: string, format: binary }
                lat: { type: number }
                lng: { type: number }
                accuracy: { type: number }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ChatView" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "413": { $ref: "#/components/responses/ErrorResponse" }
        "415": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/lapor/chats/{id}:
    get:
      tags: [anon]
      summary: Chat detail (messages + attachments) for the owning session
      security:
        - anonCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ChatDetail" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [anon]
      summary: Soft-hide chat on student side
      security:
        - anonCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
  /api/v1/lapor/chats/{id}/messages:
    post:
      tags: [anon]
      summary: Student reply (multipart; requeues chat to 'baru')
      security:
        - anonCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 2000 }
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MessageView" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/lapor/attachments/{id}:
    get:
      tags: [anon]
      summary: Serve attachment to the owning session
      security:
        - anonCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File (Content-Disposition attachment)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/attachments/{id}:
    get:
      tags: [reports]
      summary: Serve attachment (staff; BK sees all)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File (Content-Disposition attachment)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/reports:
    get:
      tags: [reports]
      summary: BK sidebar queue (PIN ∪ DRAFT ∪ ANTREAN; excludes 'dilewati')
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportItem" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/reports/history:
    get:
      tags: [reports]
      summary: BK history (skipped 'dilewati' + hidden_by_staff_at)
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportItem" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/reports/{id}:
    get:
      tags: [reports]
      summary: Report detail (messages + attachments)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReportDetail" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [reports]
      summary: Soft-hide report on BK side
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
  /api/v1/reports/{id}/pin:
    post:
      tags: [reports]
      summary: Pin (sets pinned_at, clears drafted_at)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
    delete:
      tags: [reports]
      summary: Unpin
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
  /api/v1/reports/{id}/draft:
    post:
      tags: [reports]
      summary: Mark as draft (sets drafted_at, clears pinned_at)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
  /api/v1/reports/{id}/next:
    post:
      tags: [reports]
      summary: Skip/leave (requires ≥1 reply); clears draft and sets status 'dilewati'
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/reports/{id}/messages:
    post:
      tags: [reports]
      summary: BK reply
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MessageView" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students:
    get:
      tags: [students]
      summary: List students (BK all, Wali Kelas scoped to own kelas)
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
        - name: filter
          in: query
          schema: { type: string, enum: [all, red_flag, archived, incomplete, not_observed] }
          description: 'Filter daftar: red_flag (red flag belum ditangani), archived (diarsipkan), incomplete (e-rapor < 5 mapel), not_observed (belum diobservasi)'
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StudentItem" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [students]
      summary: Create student manually (Wali Kelas only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStudentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudentItem" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/import/template:
    get:
      tags: [students]
      summary: Download a leger template (xlsx/csv) pre-filled with the Wali Kelas kelas
      security:
        - cookieAuth: []
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [xlsx, csv], default: xlsx }
      responses:
        "200":
          description: File download (Content-Disposition attachment)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/import/preview:
    post:
      tags: [students]
      summary: Upload leger E-Rapor (.xlsx/.csv) → preview (no DB writes; returns preview_token)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ImportPreview" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "413": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/import/commit:
    post:
      tags: [students]
      summary: Apply a preview (upsert by NISN)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_token]
              properties:
                preview_token: { type: string }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ImportResult" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "410": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}:
    get:
      tags: [students]
      summary: Student detail (profile + observations + latest_summary)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudentDetail" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      tags: [students]
      summary: Edit student name/NISN/kelas (Wali Kelas only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStudentInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudentItem" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/profile:
    put:
      tags: [students]
      summary: Save student profile (Wali Kelas only) — triggers AI summary
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ProfileView" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/archive:
    post:
      tags: [students]
      summary: Archive student (Wali Kelas only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/restore:
    post:
      tags: [students]
      summary: Restore archived student (Wali Kelas only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/observations:
    get:
      tags: [observations]
      summary: List observations for a student
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ObservationView" }
                  meta: { $ref: "#/components/schemas/Meta" }
    post:
      tags: [observations]
      summary: Create observation (Wali Kelas only) — triggers AI summary
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObservationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ObservationView" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/summaries:
    get:
      tags: [students]
      summary: List AI summary versions for a student
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SummaryView" }
                  meta: { $ref: "#/components/schemas/Meta" }
  /api/v1/students/{id}/summaries/latest:
    get:
      tags: [students]
      summary: Latest AI summary (503 AI_NOT_CONFIGURED when AI off)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SummaryView" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/students/{id}/summaries/{sid}/export:
    get:
      tags: [students]
      summary: Export summary as PDF/TXT (records an audit row)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [pdf, txt] }
      responses:
        "200":
          description: File download (Content-Disposition attachment)
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/observations/{id}:
    put:
      tags: [observations]
      summary: Edit observation (Wali Kelas only) — saves a revision — triggers AI summary
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObservationInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ObservationView" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/observations/{id}/revisions:
    get:
      tags: [observations]
      summary: Observation edit history
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RevisionView" }
  /api/v1/observations/{id}/handle:
    post:
      tags: [observations]
      summary: Mark a red-flag observation as handled (BK only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/OkResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/red-flags:
    get:
      tags: [observations]
      summary: Active red flags (BK all, Wali Kelas scoped); only unhandled
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RedFlagItem" }
                  meta: { $ref: "#/components/schemas/Meta" }
  /api/v1/checklist:
    get:
      tags: [observations]
      summary: Fixed observation checklist catalog (28 items)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ChecklistItem" }
  /api/v1/dashboard/bk:
    get:
      tags: [dashboard]
      summary: Aggregate dashboard for Guru BK (chat stats, red flags, latest summaries, chart, classes)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DashboardBK" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/dashboard/wk:
    get:
      tags: [dashboard]
      summary: Aggregate dashboard for Wali Kelas (scoped to own class)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DashboardWK" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/classes:
    get:
      tags: [dashboard]
      summary: Class list with stats (BK all classes, Wali Kelas own class)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ClassItem" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
    bearerAuth:
      type: http
      scheme: bearer
    anonCookie:
      type: apiKey
      in: cookie
      name: anon_token
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OkResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  ok: { type: boolean }
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        db:
          type: string
          enum: [up, down]
    Meta:
      type: object
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [INVALID_INPUT, UNAUTHORIZED, TOKEN_EXPIRED, FORBIDDEN, ACCOUNT_INACTIVE,
                 OUT_OF_SCOPE, CHAT_HIDDEN_BY_STUDENT, CHAT_CLOSED_BY_STAFF, OUT_OF_RANGE,
                 LOCATION_IMPRECISE, LOCATION_UNAVAILABLE, NOT_FOUND, PREVIEW_EXPIRED,
                 CONFLICT, RATE_LIMITED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA,
                 AI_NOT_CONFIGURED, AI_FAILED, INTERNAL]
            message:
              type: string
    AnonProfile:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        kelas: { type: string, maxLength: 40 }
    ChatSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        identity_mode: { type: string, enum: [anonim, profil] }
        status: { type: string, enum: [baru, dibuka, dilewati] }
        last_message_at: { type: string, format: date-time }
    ChatView:
      type: object
      properties:
        id: { type: string, format: uuid }
        identity_mode: { type: string, enum: [anonim, profil] }
        status: { type: string, enum: [baru, dibuka, dilewati] }
    ChatDetail:
      type: object
      properties:
        chat: { $ref: "#/components/schemas/ChatView" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/MessageView" }
    LaporBootstrap:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/AnonProfile" }
        chats:
          type: array
          items: { $ref: "#/components/schemas/ChatSummary" }
    ReportIdentity:
      type: object
      properties:
        mode: { type: string, enum: [anonim, profil] }
        name: { type: string, nullable: true }
        kelas: { type: string, nullable: true }
    ReportItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [baru, dibuka, dilewati] }
        pinned: { type: boolean }
        drafted: { type: boolean }
        pinned_at: { type: string, format: date-time, nullable: true }
        drafted_at: { type: string, format: date-time, nullable: true }
        identity: { $ref: "#/components/schemas/ReportIdentity" }
        last_message_at: { type: string, format: date-time }
    AttachmentView:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mime: { type: string }
        size_bytes: { type: integer }
    MessageView:
      type: object
      properties:
        id: { type: string, format: uuid }
        sender: { type: string, enum: [SISWA, BK] }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AttachmentView" }
        created_at: { type: string, format: date-time }
    ReportDetail:
      type: object
      properties:
        chat: { $ref: "#/components/schemas/ReportItem" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/MessageView" }
    StudentItem:
      type: object
      required: [id, name, kelas]
      properties:
        id: { type: string, format: uuid }
        nisn: { type: string, description: 'Nomor Induk Siswa Nasional (digit, 4-20)' }
        name: { type: string }
        kelas: { type: string }
        archived_at: { type: string, format: date-time, nullable: true }
        has_red_flag: { type: boolean }
        e_rapor_complete: { type: boolean, description: 'Nilai e-rapor terisi ≥ 5 mapel' }
        observed: { type: boolean, description: 'Punya ≥ 1 observasi' }
        has_summary: { type: boolean, description: 'Punya ≥ 1 ringkasan AI' }
    CreateStudentInput:
      type: object
      required: [name, kelas]
      properties:
        nisn: { type: string, description: 'Nomor Induk Siswa Nasional (digit, 4-20)' }
        name: { type: string }
        kelas: { type: string }
    EraporRow:
      type: object
      required: [mapel, nilai]
      properties:
        mapel: { type: string }
        nilai: { type: number }
        periode: { type: string }
    ProfileInput:
      type: object
      properties:
        nilai_erapor:
          type: array
          items: { $ref: "#/components/schemas/EraporRow" }
        sakit: { type: integer, minimum: 0 }
        izin: { type: integer, minimum: 0 }
        alpa: { type: integer, minimum: 0 }
        minat_bakat: { type: string, maxLength: 1000 }
        tanggal_lahir: { type: string, format: date }
        catatan_psikologis: { type: string, maxLength: 2000 }
        catatan_kasus_prestasi: { type: string, maxLength: 2000 }
        masukan_bk: { type: string, maxLength: 2000 }
        pendapat_wali_kelas: { type: string, maxLength: 2000 }
    ProfileView:
      type: object
      properties:
        nilai_erapor:
          type: array
          items: { $ref: "#/components/schemas/EraporRow" }
        sakit: { type: integer }
        izin: { type: integer }
        alpa: { type: integer }
        minat_bakat: { type: string }
        tanggal_lahir: { type: string, format: date }
        catatan_psikologis: { type: string }
        catatan_kasus_prestasi: { type: string }
        masukan_bk: { type: string }
        pendapat_wali_kelas: { type: string }
        updated_at: { type: string, format: date-time }
    ObservationInput:
      type: object
      required: [items, tanggal]
      properties:
        items:
          type: array
          items: { type: string }
          description: 'Item keys, e.g. "emosi:murung" or "tidak_ada" (exclusive)'
        catatan: { type: string, maxLength: 1000 }
        tanggal: { type: string, format: date }
        tindakan_awal:
          type: string
          enum: [pantau, konsultasi_bk, eskalasi_segera]
    ObservationView:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        items:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
        red_flag: { type: boolean }
        handled_at: { type: string, format: date-time, nullable: true }
        catatan: { type: string }
        tanggal: { type: string, format: date }
        tindakan_awal: { type: string }
        author:
          type: object
          properties:
            name: { type: string }
    RevisionView:
      type: object
      properties:
        id: { type: string, format: uuid }
        edited_by: { type: string, format: uuid }
        snapshot: {}
        created_at: { type: string, format: date-time }
    RedFlagItem:
      type: object
      properties:
        student_id: { type: string, format: uuid }
        student_name: { type: string }
        kelas: { type: string }
        observation_id: { type: string, format: uuid }
        tanggal: { type: string, format: date }
        red_flag_items:
          type: array
          items: { type: string }
    ChecklistItem:
      type: object
      properties:
        key: { type: string }
        kategori: { type: string }
        label: { type: string }
    ChatStats:
      type: object
      properties:
        waiting: { type: integer }
        pinned: { type: integer }
        drafted: { type: integer }
        queued: { type: integer }
        unqueued: { type: integer }
    ChartPoint:
      type: object
      properties:
        label: { type: string }
        pinned: { type: integer }
        drafted: { type: integer }
        queued: { type: integer }
    ClassItem:
      type: object
      properties:
        kelas: { type: string }
        grade: { type: string }
        homeroom: { type: string }
        students: { type: integer }
        red_flag: { type: integer }
        status: { type: string, enum: [flagged, complete, not_filled] }
    RedTop:
      type: object
      properties:
        student: { $ref: "#/components/schemas/StudentItem" }
        tanggal: { type: string, format: date }
    LatestSummary:
      type: object
      properties:
        student: { $ref: "#/components/schemas/StudentItem" }
        summary: { $ref: "#/components/schemas/SummaryView" }
    DashboardBK:
      type: object
      properties:
        chats: { $ref: "#/components/schemas/ChatStats" }
        red_flags: { type: integer }
        summaries: { type: integer }
        latest:
          type: array
          items: { $ref: "#/components/schemas/LatestSummary" }
        red_top: { $ref: "#/components/schemas/RedTop", nullable: true }
        chart:
          type: array
          items: { $ref: "#/components/schemas/ChartPoint" }
        classes:
          type: array
          items: { $ref: "#/components/schemas/ClassItem" }
    DashboardWK:
      type: object
      properties:
        students: { type: integer }
        e_rapor_complete: { type: integer }
        observed: { type: integer }
        red_flags: { type: integer }
        red_top: { $ref: "#/components/schemas/StudentItem", nullable: true }
        chart:
          type: array
          items: { $ref: "#/components/schemas/ChartPoint" }
    SummaryView:
      type: object
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        sources: {}
        model: { type: string }
        status: { type: string, enum: [ready, failed] }
        error: { type: string }
        created_at: { type: string, format: date-time }
    ImportRow:
      type: object
      properties:
        nisn: { type: string }
        nama: { type: string }
        kelas: { type: string }
        nilai_erapor:
          type: array
          items: { $ref: "#/components/schemas/EraporRow" }
        sakit: { type: integer }
        izin: { type: integer }
        alpa: { type: integer }
    ImportPreview:
      type: object
      properties:
        preview_token: { type: string }
        baru:
          type: array
          items: { $ref: "#/components/schemas/ImportRow" }
        update:
          type: array
          items: { $ref: "#/components/schemas/ImportRow" }
        errors:
          type: array
          items:
            type: object
            properties:
              baris: { type: integer }
              nisn: { type: string }
              pesan: { type: string }
        ringkasan:
          type: object
          properties:
            total: { type: integer }
            baru: { type: integer }
            update: { type: integer }
            error: { type: integer }
    ImportResult:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        errors: { type: integer }
    StudentDetail:
      type: object
      properties:
        student: { $ref: "#/components/schemas/StudentItem" }
        profile: { $ref: "#/components/schemas/ProfileView" }
        observations:
          type: array
          items: { $ref: "#/components/schemas/ObservationView" }
        summaries:
          type: array
          description: Semua versi ringkasan AI (terbaru lebih dulu)
          items: { $ref: "#/components/schemas/SummaryView" }
        latest_summary:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SummaryView"
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
